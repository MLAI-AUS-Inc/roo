name: Payment reminder tests

on:
  pull_request:
    paths:
      - "src/roo/payment_reminders.py"
      - "src/roo/payment_reminder_worker.py"
      - "tests/roo/test_payment_reminders.py"
      - "infra/docker-compose*.yml"
      - "src/.env*.example"
      - "docs/payment-reminders.md"
      - ".github/workflows/payment-reminder-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/roo/payment_reminders.py"
      - "src/roo/payment_reminder_worker.py"
      - "tests/roo/test_payment_reminders.py"
      - "infra/docker-compose*.yml"
      - "src/.env*.example"
      - "docs/payment-reminders.md"
      - ".github/workflows/payment-reminder-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'pytest>=7.4,<10' 'httpx>=0.25,<1'
      - run: python -m pytest ../tests/roo/test_payment_reminders.py -q
        working-directory: src
      - name: Verify worker project isolation from public orphan cleanup
        working-directory: src
        run: |
          set -eu
          cp .env.example .env
          cp .env.payment-reminders.example .env.payment-reminders
          trap 'rm -f .env .env.payment-reminders' EXIT
          COMPOSE_PROJECT_NAME=roo-standalone docker compose --env-file .env -f ../infra/docker-compose.yml config --format json > "$RUNNER_TEMP/roo-public.json"
          docker compose --env-file .env -f ../infra/docker-compose.payment-reminders.yml config --format json > "$RUNNER_TEMP/payment-default.json"
          COMPOSE_PROJECT_NAME=roo-standalone docker compose --env-file .env -p roo-payment-reminders -f ../infra/docker-compose.payment-reminders.yml config --format json > "$RUNNER_TEMP/payment-explicit.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          public = json.loads((root / "roo-public.json").read_text())
          default = json.loads((root / "payment-default.json").read_text())
          explicit = json.loads((root / "payment-explicit.json").read_text())
          assert public["name"] == "roo-standalone"
          for worker in (default, explicit):
              assert worker["name"] == "roo-payment-reminders"
              assert worker["name"] != public["name"]
              assert set(worker["services"]) == {"payment-reminders"}
          assert default["volumes"] == explicit["volumes"]
          guide = Path("../docs/payment-reminders.md").read_text()
          commands = [line for line in guide.splitlines() if "docker compose --env-file .env " in line]
          assert commands
          assert all("docker compose --env-file .env -p roo-payment-reminders -f " in line for line in commands)
          PY
