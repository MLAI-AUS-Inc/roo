name: Deploy to Digital Ocean

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Inspect the live Roo rollout without redeploying
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('roo-pr-{0}', github.event.pull_request.number) || 'roo-production-deploy' }}
  cancel-in-progress: false

jobs:
  security-checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostics_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: roo-standalone/requirements.txt

      - name: Install Roo dependencies
        run: python -m pip install -r roo-standalone/requirements.txt

      - name: Validate skill configuration without importing clients
        working-directory: roo-standalone
        run: python -m roo.skills.lint --public-defaults

      - name: Run Health Hack security and AI regressions
        working-directory: roo-standalone
        env:
          SLACK_BOT_TOKEN: test
          SLACK_SIGNING_SECRET: test
          OPENAI_API_KEY: test
          FOUNDER_TOOLS_LINK_ORIGINS: https://mlai.au
        run: |
          python -m pytest ../tests/roo/test_skill_loading_contract.py -q
          python -m pytest ../tests/roo/test_skill_execution_behaviors.py ../tests/roo/test_skill_executor_classes.py -q
          # Offline approval checks only; live model tests run locally with --live.
          python -m pytest ../tests/roo/test_live_skill_smoke.py::test_reaction_approval_uses_event_actor_and_backend_result -q
          # Several legacy suites install import-time module stubs. Keep the
          # surface boundary gate isolated so collection order cannot weaken it.
          python -m pytest ../tests/roo/test_surface_security.py -q
          python -m pytest ../tests/roo/test_deployment_checks.py -q
          python -m pytest ../tests/roo/test_bridge_mentions.py -q
          # Article consent and Chat card handling must run with real client imports.
          python -m pytest ../tests/roo/test_article_price_consent.py ../tests/roo/test_content_factory_article_flow.py ../tests/roo/test_chat_actions.py -q
          python -m pytest ../tests/roo/test_chat_points_awards.py -q
          # Chart rendering and binary uploads run offline, isolated from legacy stubs.
          python -m pytest ../tests/roo/test_coworking_charts.py ../tests/roo/test_slack_file_upload.py -q
          python -m pytest ../tests/roo/test_points_requests.py -k coworking -q
          # Meeting-room schema tests need the real skill parser, so keep them
          # isolated from legacy suites that stub the frontmatter module.
          python -m pytest \
            ../tests/roo/test_meeting_room_booking.py \
            ../tests/roo/test_meeting_room_clarifications.py \
            ../tests/roo/test_meeting_room_actions.py \
            -q
          python -m pytest \
            ../tests/roo/test_slack_security.py \
            ../tests/roo/test_internal_mentions.py \
            ../tests/roo/test_coworking_dates.py \
            ../tests/roo/test_backend_identity.py \
            ../tests/roo/test_mlai_backend_client.py \
            ../tests/roo/test_rate_card.py \
            ../tests/roo/test_founder_account_link.py \
            ../tests/roo/test_coworking_booking_intents.py \
            ../tests/roo/test_coworking_admin_batch.py \
            ../tests/roo/test_replay_failed_coworking.py \
            ../tests/roo/test_points_requests.py::test_book_coworking_persists_intent_and_queues_backend_timeout \
            ../tests/roo/test_points_requests.py::test_immediate_coworking_stale_worker_cannot_overwrite_winner \
            ../tests/roo/test_points_requests.py::test_book_coworking_nudges_founder_when_charged_standard_price \
            ../tests/roo/test_points_requests.py::test_book_coworking_treats_missing_link_state_as_commit_uncertain \
            ../tests/roo/test_points_requests.py::test_book_coworking_omits_nudge_when_discount_applied \
            ../tests/roo/test_points_requests.py::test_book_coworking_omits_link_nudge_when_accounts_are_linked \
            ../tests/roo/test_jobs_scheduler.py \
            ../tests/roo/test_private_points_delivery.py \
            ../tests/roo/test_points_flex.py \
            ../tests/roo/test_admin_brain.py \
            ../tests/roo/test_admin_brain_interactions.py \
            ../tests/roo/test_admin_dispatch.py \
            ../tests/roo/test_admin_worker.py \
            ../tests/roo/test_unified_admin_routing.py \
            ../tests/roo/test_unified_admin_smoke.py \
            ../tests/roo/test_admin_pilot_config.py \
            ../tests/roo/test_admin_pilot_smoke.py \
            ../tests/roo/test_admin_actions.py \
            ../tests/roo/test_router_catalog.py \
            ../tests/roo/test_linear_inference.py \
            ../tests/roo/test_linear_effort_sizing.py \
            ../tests/roo/test_linear_meeting_sources.py \
            ../tests/roo/test_linear_meeting_actions.py \
            ../tests/roo/test_ai_security.py \
            ../tests/roo/test_sim_patient.py \
            ../tests/roo/test_diagnosis_check.py \
            ../tests/roo/test_llm_agent_tools.py \
            ../tests/bridge \
            -q
          # This legacy module installs an executor stub at import time, so run
          # it in a separate process to keep the security suite isolated.
          python -m pytest ../tests/roo/test_start_here_introductions.py -q
          python -m pytest ../tests/roo/test_agent_routing.py -q
          python -m pytest ../tests/roo/test_event_discounts.py -q
          python -m pytest ../tests/roo/test_routing_eval_gate.py -q
          python -m compileall -q roo bridge
          # Isolate these from older tests that install module-level doubles.
          python -m pytest \
            ../tests/roo/test_timesheets.py \
            ../tests/roo/test_timesheet_linear.py \
            ../tests/roo/test_timesheet_plane.py \
            ../tests/roo/test_timesheet_deployment.py \
            ../tests/roo/test_timesheet_demo.py \
            ../tests/roo/test_timesheet_ingress.py \
            ../tests/roo/test_studio_invoices.py \
            ../tests/roo/test_invoice_worker.py \
            ../tests/roo/test_invoice_ingress.py \
            ../tests/roo/test_studio_reports.py \
            ../tests/roo/test_studio_report_clients.py \
            ../tests/roo/test_studio_report_source.py \
            ../tests/roo/test_invoice_source.py \
            ../tests/roo/test_studio_report_routing.py \
            ../tests/roo/test_studio_devashi_reports.py \
            ../tests/roo/test_studio_report_policy.py \
            ../tests/roo/test_studio_report_linear_policy.py \
            ../tests/roo/test_studio_report_mixed_sources.py \
            ../tests/roo/test_studio_task_burndown.py \
            ../tests/roo/test_studio_report_schedule.py \
            ../tests/roo/test_studio_report_weeks.py \
            ../tests/roo/test_studio_report_charts.py \
            ../tests/roo/test_studio_report_refresh.py \
            ../tests/roo/test_studio_report_weekly_backfill.py \
            ../tests/roo/test_studio_recorded_hours_weekly.py \
            ../tests/roo/test_studio_client_balance.py \
            ../tests/roo/test_studio_client_balance_source.py \
            ../tests/roo/test_studio_client_balance_routing.py \
            ../tests/roo/test_studio_client_balance_installer.py -q

      - name: Validate production Compose configuration
        working-directory: roo-standalone
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env -f ../infra/docker-compose.yml config --quiet
          ADMIN_ROO_ENV_FILE=../roo-standalone/.env.admin.example \
            docker compose --env-file .env -f ../infra/docker-compose.admin.yml config --quiet
          docker compose --env-file .env -f ../infra/docker-compose.bridge.yml config --quiet
          docker run --rm \
            --add-host roo:127.0.0.1 \
            --add-host roo-admin:127.0.0.1 \
            -v "$PWD/../infra/nginx/roo.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/../infra/nginx/roo-proxy.conf:/etc/nginx/roo-proxy.conf:ro" \
            nginx:1.28.3-alpine nginx -t

  deploy:
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.diagnostics_only != true)
      }}
    needs: security-checks
    runs-on: ubuntu-latest
    steps:
      - name: Validate required Roo security secrets
        env:
          RELEASE_SHA: ${{ github.sha }}
          SIM_PATIENT_API_KEY: ${{ secrets.SIM_PATIENT_API_KEY }}
          SIM_PATIENT_SAFETY_SALT: ${{ secrets.SIM_PATIENT_SAFETY_SALT }}
          ROO_API_KEY: ${{ secrets.ROO_API_KEY }}
        run: |
          set -eu
          if [ "${#SIM_PATIENT_API_KEY}" -lt 32 ]; then
            echo "SIM_PATIENT_API_KEY is missing or shorter than 32 characters" >&2
            exit 1
          fi
          if [ "${#SIM_PATIENT_SAFETY_SALT}" -lt 32 ]; then
            echo "SIM_PATIENT_SAFETY_SALT is missing or shorter than 32 characters" >&2
            exit 1
          fi
          if [ "${#ROO_API_KEY}" -lt 32 ]; then
            echo "ROO_API_KEY is missing or shorter than 32 characters" >&2
            exit 1
          fi
          if [ "$SIM_PATIENT_API_KEY" = "$SIM_PATIENT_SAFETY_SALT" ] || [ "$SIM_PATIENT_API_KEY" = "$ROO_API_KEY" ] || [ "$SIM_PATIENT_SAFETY_SALT" = "$ROO_API_KEY" ]; then
            echo "Roo service credentials must be distinct" >&2
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
          SIM_PATIENT_API_KEY: ${{ secrets.SIM_PATIENT_API_KEY }}
          SIM_PATIENT_SAFETY_SALT: ${{ secrets.SIM_PATIENT_SAFETY_SALT }}
          ROO_API_KEY: ${{ secrets.ROO_API_KEY }}
          ROO_PUBLIC_HOST: ${{ secrets.DO_HOST }}
          ROO_PRIVATE_BASE_URL: ${{ vars.ROO_PRIVATE_BASE_URL }}
          MEETING_ROOM_BOOKING_ENABLED: ${{ vars.MEETING_ROOM_BOOKING_ENABLED || 'false' }}
          LINEAR_CHANNEL_ISSUE_WRITES_ENABLED: ${{ vars.LINEAR_CHANNEL_ISSUE_WRITES_ENABLED || 'false' }}
          FOUNDER_ACCOUNT_LINK_ENABLED: ${{ vars.FOUNDER_ACCOUNT_LINK_ENABLED || 'false' }}
          COWORKING_REPORT_SLACK_TEAM_ID: ${{ vars.COWORKING_REPORT_SLACK_TEAM_ID }}
          COWORKING_REPORT_SLACK_CHANNEL_ID: ${{ vars.COWORKING_REPORT_SLACK_CHANNEL_ID }}
          COWORKING_INTENTS_V3_MIGRATION_APPROVED: ${{ vars.COWORKING_INTENTS_V3_MIGRATION_APPROVED || 'false' }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: SIM_PATIENT_API_KEY,SIM_PATIENT_SAFETY_SALT,ROO_API_KEY,ROO_PUBLIC_HOST,ROO_PRIVATE_BASE_URL,MEETING_ROOM_BOOKING_ENABLED,LINEAR_CHANNEL_ISSUE_WRITES_ENABLED,FOUNDER_ACCOUNT_LINK_ENABLED,COWORKING_REPORT_SLACK_TEAM_ID,COWORKING_REPORT_SLACK_CHANNEL_ID,COWORKING_INTENTS_V3_MIGRATION_APPROVED,RELEASE_SHA
          script: |
            # Stop if any command fails
            set -eu

            # Fail before touching the existing environment if forwarding was
            # misconfigured. Values are intentionally never printed.
            if [ "${#SIM_PATIENT_API_KEY}" -lt 32 ] || [ "${#SIM_PATIENT_SAFETY_SALT}" -lt 32 ] || [ "${#ROO_API_KEY}" -lt 32 ]; then
              echo "Required Roo security secrets were not forwarded" >&2
              exit 1
            fi
            if [ "$SIM_PATIENT_API_KEY" = "$SIM_PATIENT_SAFETY_SALT" ] || [ "$SIM_PATIENT_API_KEY" = "$ROO_API_KEY" ] || [ "$SIM_PATIENT_SAFETY_SALT" = "$ROO_API_KEY" ]; then
              echo "Roo service credentials must be distinct" >&2
              exit 1
            fi
            if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "RELEASE_SHA must be a full 40-character Git commit SHA" >&2
              exit 1
            fi
            case "$MEETING_ROOM_BOOKING_ENABLED" in
              true|TRUE|True|1|yes|YES|Yes|on|ON|On) MEETING_ROOM_BOOKING_ENABLED=true ;;
              false|FALSE|False|0|no|NO|No|off|OFF|Off|"") MEETING_ROOM_BOOKING_ENABLED=false ;;
              *)
                echo "MEETING_ROOM_BOOKING_ENABLED must be true or false" >&2
                exit 1
                ;;
            esac
            case "$LINEAR_CHANNEL_ISSUE_WRITES_ENABLED" in
              true|TRUE|True|1|yes|YES|Yes|on|ON|On) LINEAR_CHANNEL_ISSUE_WRITES_ENABLED=true ;;
              false|FALSE|False|0|no|NO|No|off|OFF|Off|'') LINEAR_CHANNEL_ISSUE_WRITES_ENABLED=false ;;
              *) echo "LINEAR_CHANNEL_ISSUE_WRITES_ENABLED must be boolean" >&2; exit 1 ;;
            esac
            case "$FOUNDER_ACCOUNT_LINK_ENABLED" in
              true|TRUE|True|1|yes|YES|Yes|on|ON|On) FOUNDER_ACCOUNT_LINK_ENABLED=true ;;
              false|FALSE|False|0|no|NO|No|off|OFF|Off|'') FOUNDER_ACCOUNT_LINK_ENABLED=false ;;
              *) echo "FOUNDER_ACCOUNT_LINK_ENABLED must be boolean" >&2; exit 1 ;;
            esac
            case "$COWORKING_INTENTS_V3_MIGRATION_APPROVED" in
              true|TRUE|True|1|yes|YES|Yes|on|ON|On) COWORKING_INTENTS_V3_MIGRATION_APPROVED=true ;;
              false|FALSE|False|0|no|NO|No|off|OFF|Off|'') COWORKING_INTENTS_V3_MIGRATION_APPROVED=false ;;
              *) echo "COWORKING_INTENTS_V3_MIGRATION_APPROVED must be boolean" >&2; exit 1 ;;
            esac
            if [ -n "$COWORKING_REPORT_SLACK_TEAM_ID" ] || [ -n "$COWORKING_REPORT_SLACK_CHANNEL_ID" ]; then
              printf '%s' "$COWORKING_REPORT_SLACK_TEAM_ID" | grep -Eq '^T[A-Z0-9]+$'
              printf '%s' "$COWORKING_REPORT_SLACK_CHANNEL_ID" | grep -Eq '^[CG][A-Z0-9]+$'
            fi
            
            # Define deployment directory
            DEPLOY_DIR="/root/roo"
            
            # Clone the repository once, then deploy the exact workflow SHA.
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/MLAI-AUS-Inc/roo.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            previous_release_sha="$(git rev-parse HEAD)"
            cd "$DEPLOY_DIR/roo-standalone"
            previous_env_backup="$(mktemp /root/roo-public-env.XXXXXX)"
            previous_env_present=0
            if [ -f .env ]; then
              cp .env "$previous_env_backup"
              chmod 600 "$previous_env_backup"
              previous_env_present=1
            fi
            # The previous release may predate the infra/ directory move.
            previous_compose_dir="../infra"
            if [ -f docker-compose.yml ]; then
              previous_compose_dir="."
            fi
            previous_container_id="$(docker compose --env-file .env -f "$previous_compose_dir/docker-compose.yml" ps -q roo 2>/dev/null || true)"
            previous_image_id=""
            previous_image_ref=""
            if [ -n "$previous_container_id" ]; then
              previous_image_id="$(docker inspect --format '{{.Image}}' "$previous_container_id")"
              previous_image_ref="$(docker inspect --format '{{.Config.Image}}' "$previous_container_id")"
            fi
            previous_bridge_mode="none"
            if command -v systemctl >/dev/null 2>&1 \
              && systemctl is-active --quiet slack-bridge.service; then
              previous_bridge_mode="systemd"
            elif docker compose --env-file .env -f "$previous_compose_dir/docker-compose.bridge.yml" ps \
              --services --status running | grep -qx slack-bridge; then
              previous_bridge_mode="compose"
            fi

            restart_bridge_for_checkout() {
              bridge_compose_file="../infra/docker-compose.bridge.yml"
              if [ -f docker-compose.bridge.yml ]; then
                bridge_compose_file="docker-compose.bridge.yml"
              fi
              case "$previous_bridge_mode" in
                systemd)
                  systemctl restart slack-bridge.service
                  ;;
                compose)
                  docker compose --env-file .env -f "$bridge_compose_file" up -d --build \
                    --force-recreate
                  ;;
                none)
                  return 0
                  ;;
              esac
              bridge_attempt=0
              until bridge_container_id="$(docker compose --env-file .env \
                -f "$bridge_compose_file" ps -q slack-bridge)" \
                && [ -n "$bridge_container_id" ] \
                && [ "$(docker inspect --format \
                  '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "$bridge_container_id")" = "healthy" ]; do
                bridge_attempt=$((bridge_attempt + 1))
                if [ "$bridge_attempt" -ge 18 ]; then
                  echo "Slack bridge readiness check timed out" >&2
                  return 1
                fi
                sleep 5
              done
            }

            schema_migration_started=0
            rollback_release() {
              status="$?"
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                if [ "$schema_migration_started" = "1" ]; then
                  echo "Deployment failed after schema advancement; keeping Roo stopped for forward recovery" >&2
                  docker compose --env-file .env -f ../infra/docker-compose.yml stop roo || true
                  rm -f "$previous_env_backup"
                  exit "$status"
                fi
                echo "Roo rollout failed; restoring the previous release" >&2
                if [ "$previous_env_present" -eq 1 ]; then
                  cp "$previous_env_backup" "$DEPLOY_DIR/roo-standalone/.env"
                  chmod 600 "$DEPLOY_DIR/roo-standalone/.env"
                else
                  rm -f "$DEPLOY_DIR/roo-standalone/.env"
                fi
                cd "$DEPLOY_DIR"
                git checkout --detach "$previous_release_sha" || true
                cd "$DEPLOY_DIR/roo-standalone"
                if [ -n "$previous_image_id" ] && [ -n "$previous_image_ref" ]; then
                  docker image tag "$previous_image_id" "$previous_image_ref" || true
                  docker compose --env-file .env -f "$previous_compose_dir/docker-compose.yml" --ansi never up -d --no-build --force-recreate --remove-orphans || true
                fi
                # The bridge is built from the same checkout but supervised
                # separately. Restore and verify it after returning to the
                # previous source revision so a rejected candidate cannot stay
                # live beside a rolled-back Roo service.
                if ! restart_bridge_for_checkout; then
                  echo "Slack bridge rollback failed" >&2
                  status=1
                fi
              fi
              rm -f "$previous_env_backup"
              exit "$status"
            }
            trap rollback_release EXIT

            cd "$DEPLOY_DIR"
            git fetch origin main
            git cat-file -e "${RELEASE_SHA}^{commit}"
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main
            git checkout --detach "$RELEASE_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            
            # Go to the sub-project directory
            cd "$DEPLOY_DIR/roo-standalone"

            docker network inspect roo-admin-gateway >/dev/null 2>&1 \
              || docker network create roo-admin-gateway

            # Update security settings without printing secret values. Rebuild
            # the file atomically so duplicate/stale keys cannot win.
            umask 077
            touch .env
            upsert_env() {
              key="$1"
              value="$2"
              tmp_file="$(mktemp .env.tmp.XXXXXX)"
              grep -v "^${key}=" .env > "$tmp_file" || true
              printf '%s=%s\n' "$key" "$value" >> "$tmp_file"
              chmod 600 "$tmp_file"
              mv "$tmp_file" .env
            }
            upsert_env "ROO_ENVIRONMENT" "production"
            upsert_env "ROO_RELEASE_SHA" "$RELEASE_SHA"
            # Retired features no longer consume these keys. Preserve the shared
            # receipt/booking databases; removing configuration is not data deletion.
            python3 -m roo.retired_feature_config .env
            upsert_env "SIM_PATIENT_API_KEY" "$SIM_PATIENT_API_KEY"
            upsert_env "SIM_PATIENT_SAFETY_SALT" "$SIM_PATIENT_SAFETY_SALT"
            upsert_env "ROO_API_KEY" "$ROO_API_KEY"
            upsert_env "ROO_POINTS_TOPUP_ENABLED" "true"
            upsert_env "ROO_POINTS_TOPUP_BUTTONS_ENABLED" "true"
            upsert_env "ROO_POINTS_STRIPE_CHECKOUT_HOSTS" "checkout.stripe.com"
            upsert_env "MEETING_ROOM_BOOKING_ENABLED" "$MEETING_ROOM_BOOKING_ENABLED"
            upsert_env "FOUNDER_TOOLS_LINK_ORIGINS" "https://mlai.au,https://chat.mlai.au"
            upsert_env "FOUNDER_ACCOUNT_LINK_ENABLED" "$FOUNDER_ACCOUNT_LINK_ENABLED"
            upsert_env "COWORKING_REPORT_SLACK_TEAM_ID" "$COWORKING_REPORT_SLACK_TEAM_ID"
            upsert_env "COWORKING_REPORT_SLACK_CHANNEL_ID" "$COWORKING_REPORT_SLACK_CHANNEL_ID"
            implicit_actions="respond_in_chat,mlai-points:balance,mlai-points:topup_points"
            if [ "$FOUNDER_ACCOUNT_LINK_ENABLED" = "true" ]; then
              implicit_actions="$implicit_actions,mlai-points:link_founder_account"
            fi
            upsert_env "ROO_IMPLICIT_ACTION_ALLOWLIST" "$implicit_actions"
            upsert_env "LINEAR_CHANNEL_ISSUE_WRITES_ENABLED" "$LINEAR_CHANNEL_ISSUE_WRITES_ENABLED"
            
            # Build first, then run or validate the explicitly approved schema
            # migration before any new application process can report ready.
            docker compose --env-file .env -f ../infra/docker-compose.yml build roo

            if [ "$COWORKING_INTENTS_V3_MIGRATION_APPROVED" = "true" ]; then
              # Stop every process that can write the shared SQLite volume
              # before crossing the irreversible privacy/outbox boundary.
              docker compose --env-file .env -f ../infra/docker-compose.yml stop roo
              schema_migration_started=1
              docker compose --env-file .env -f ../infra/docker-compose.yml run -T --rm --no-deps roo \
                python scripts/migrate_coworking_booking_intents_v3.py </dev/null
            else
              docker compose --env-file .env -f ../infra/docker-compose.yml run -T --rm --no-deps roo python -c \
                'from roo.coworking_booking_intents import get_coworking_intent_store; get_coworking_intent_store().validate_schema()' \
                </dev/null
            fi

            # Restart the app only after schema validation succeeds.
            docker compose --env-file .env -f ../infra/docker-compose.yml up -d --no-build --remove-orphans

            # Bounded readiness check. Never wait forever on a broken release.
            ready_attempt=0
            until curl --silent --show-error --fail --max-time 5 \
              http://127.0.0.1/healthz/ready >/dev/null; do
              ready_attempt=$((ready_attempt + 1))
              if [ "$ready_attempt" -ge 18 ]; then
                echo "Roo readiness check timed out" >&2
                false
              fi
              sleep 5
            done

            docker compose --env-file .env -f ../infra/docker-compose.yml exec -T -e EXPECTED_RELEASE_SHA="$RELEASE_SHA" -e EXPECTED_FOUNDER_ACCOUNT_LINK_ENABLED="$FOUNDER_ACCOUNT_LINK_ENABLED" roo python -c 'import os; from roo.config import get_settings; settings = get_settings(); actions = settings.implicit_action_allowlist; assert os.environ.get("ROO_RELEASE_SHA") == os.environ["EXPECTED_RELEASE_SHA"]; assert settings.FOUNDER_ACCOUNT_LINK_ENABLED is (os.environ["EXPECTED_FOUNDER_ACCOUNT_LINK_ENABLED"] == "true"); assert ("mlai-points:link_founder_account" in actions) is settings.FOUNDER_ACCOUNT_LINK_ENABLED; assert "mlai-points:link_account" not in actions; print({"release_sha": os.environ["ROO_RELEASE_SHA"], "founder_account_link_enabled": settings.FOUNDER_ACCOUNT_LINK_ENABLED, "link_action_enabled": "mlai-points:link_founder_account" in actions})'

            if [ "$FOUNDER_ACCOUNT_LINK_ENABLED" = "true" ]; then
              docker compose --env-file .env -f ../infra/docker-compose.yml exec -T roo python -c '
            import json
            import urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8000/healthz/dependencies", timeout=8) as response:
                payload = json.load(response)
            dependency = payload.get("dependencies", {}).get("mlai_backend", {})
            assert payload.get("status") == "ok", payload
            assert dependency.get("founder_account_link") == {
                "status": "ok",
                "contract": "slack-founder-link-v1",
            }, payload
            '
            fi

            if [ "$MEETING_ROOM_BOOKING_ENABLED" = "true" ]; then
              echo "Verifying the Meeting Room skill is enabled on Public Roo..."
              docker compose --env-file .env -f ../infra/docker-compose.yml exec -T roo python -c 'from roo.config import get_settings; settings = get_settings(); assert settings.ROO_SURFACE == "public"; assert settings.MEETING_ROOM_BOOKING_ENABLED is True; assert "meeting-room-booking" in settings.enabled_skill_names'
            fi

            # The cross-workspace Slack bridge is a separate Compose project.
            # Rebuild it when it is already deployed, preserving its current
            # supervisor instead of silently leaving old mention logic live.
            if [ "$previous_bridge_mode" != "none" ]; then
              restart_bridge_for_checkout
            else
              echo "Slack bridge is not deployed on this host; skipping restart"
            fi

            # When configured, traverse the same private-VPC base URL used by
            # MLAI Backend. The malformed schema fails before any model call.
            # Cross-service integration smoke owns this check when the variable
            # is intentionally absent.
            if [ -n "${ROO_PRIVATE_BASE_URL:-}" ]; then
              private_status="$(curl --silent --show-error --max-time 8 \
                --output /dev/null --write-out '%{http_code}' \
                --request POST "${ROO_PRIVATE_BASE_URL%/}/api/sim-patient" \
                --header "Authorization: Bearer $SIM_PATIENT_API_KEY" \
                --header 'Content-Type: application/json' \
                --data '{"question":""}')"
              if [ "$private_status" != "422" ]; then
                echo "Private authenticated validation check failed (status $private_status)" >&2
                false
              fi
            fi

            # Verify public Roo containment through the deployed public route
            # while rollback state and the previous image are still retained.
            # Any failure exits through rollback_release.
            public_base_url="http://${ROO_PUBLIC_HOST}"
            expect_public_status() {
              expected="$1"
              method="$2"
              path="$3"
              actual="$(curl --silent --show-error --max-time 8 \
                --output /dev/null --write-out '%{http_code}' \
                --request "$method" "${public_base_url}${path}")"
              if [ "$actual" != "$expected" ]; then
                echo "Public containment failed for $path (status $actual)" >&2
                exit 1
              fi
            }
            expect_public_status 200 GET /healthz/ready
            expect_public_status 404 GET /healthz/dependencies
            expect_public_status 404 GET /docs
            expect_public_status 404 POST /api/mention
            expect_public_status 403 POST /api/sim-patient
            expect_public_status 403 POST /api/diagnosis-check
            
            # Clean up only after every rollback-capable gate has passed.
            docker image prune -f

  rollout-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics_only == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Roo rollout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -eu
            cd /root/roo/roo-standalone

            docker compose --env-file .env -f ../infra/docker-compose.yml ps
            docker compose --env-file .env -f ../infra/docker-compose.yml exec -T roo python -c '
            from roo.config import get_settings
            settings = get_settings()
            print({
                "topup_enabled": settings.ROO_POINTS_TOPUP_ENABLED,
                "buttons_enabled": settings.ROO_POINTS_TOPUP_BUTTONS_ENABLED,
                "checkout_hosts": sorted(settings.roo_points_stripe_checkout_hosts),
            })
            '

            docker compose --env-file .env -f ../infra/docker-compose.yml logs --since=6h --tail=10000 2>&1 \
              | grep -E 'Received Slack event|Slack private|Private message|ROUTING_DECISION|LINEAR_INFERENCE|LINEAR_MEETING_EXTRACTION|LINEAR_PROJECT_RESOLUTION|topup|checkout-options|Traceback|ERROR|Error|Exception|error_type|1785144941' \
              | sed -E 's#https://checkout\.stripe\.com/[^ ]+#https://checkout.stripe.com/[redacted]#g' \
              || true
