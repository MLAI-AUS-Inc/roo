# Separate project so Public Roo --remove-orphans cannot remove the worker.
name: roo-timesheets

services:
  timesheets:
    build:
      context: ../src
      dockerfile: ../infra/Dockerfile
    command: ["python", "-m", "roo.timesheet_worker"]
    env_file:
      - ../src/.env.timesheets
    environment:
      TIMESHEET_DATA_DIR: /app/timesheets/data
      TIMESHEET_QUEUE_DIR: /app/timesheets/queue
      STUDIO_INVOICE_QUEUE_DIR: /app/timesheets/invoice-queue
    restart: unless-stopped
    volumes:
      - timesheet-data:/app/timesheets/data
      - ../src/data/timesheet-queue:/app/timesheets/queue
      - ../src/data/invoice-queue:/app/timesheets/invoice-queue

volumes:
  timesheet-data:
