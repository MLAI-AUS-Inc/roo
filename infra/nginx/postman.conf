# Local Postman proxy. Use only with docker-compose.postman.yml.
upstream roo_internal {
    server roo:8000;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;

    location = /healthz/ready { include /etc/nginx/roo-proxy.conf; }
    location = /api/mention { include /etc/nginx/roo-proxy.conf; }
    location / { return 404; }
}
