# Opt-in override for the existing Public Roo project. Share request metadata
# only; report snapshots and credentials belong exclusively to the worker.
services:
  roo:
    environment:
      TIMESHEET_QUEUE_DIR: /app/timesheets/queue
      STUDIO_INVOICE_QUEUE_DIR: /app/timesheets/invoice-queue
    volumes:
      - ../src/data/timesheet-queue:/app/timesheets/queue
      - ../src/data/invoice-queue:/app/timesheets/invoice-queue
