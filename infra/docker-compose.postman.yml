services:
  roo:
    environment:
      ROO_ENVIRONMENT: development
      MLAI_BACKEND_URL: http://host.docker.internal:8001
      JOBS_SCHEDULER_ENABLED: "false"
      BOOST_LINK_LOVE_ENABLED: "false"
      BOOST_POST_MODERATION_ENABLED: "false"
      START_HERE_INTRO_ENABLED: "false"
      ROO_CONTEXTUAL_RESPONSES_ENABLED: "false"
      ROO_CONTEXTUAL_SHADOW_MODE: "true"
  nginx-postman:
    image: nginx:1.28.3-alpine
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      roo:
        condition: service_healthy
    volumes:
      - ./nginx/postman.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/roo-proxy.conf:/etc/nginx/roo-proxy.conf:ro
