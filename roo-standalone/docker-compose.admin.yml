name: roo-admin

services:
  roo-admin:
    build: .
    expose:
      - "8000"
    env_file:
      - ${ADMIN_ROO_ENV_FILE:-.env.admin}
    environment:
      ROO_SURFACE: admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./skills:/app/skills:ro
      - roo-admin-data:/app/data
    networks:
      default:
      roo-admin-gateway:
        aliases:
          - roo-admin

volumes:
  roo-admin-data:

networks:
  roo-admin-gateway:
    external: true
    name: roo-admin-gateway
