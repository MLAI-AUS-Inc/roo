name: roo-admin

services:
  roo-admin:
    build: .
    ports:
      - "8081:8000"
    env_file:
      - .env.admin
    environment:
      ROO_SURFACE: admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./skills:/app/skills:ro
      - roo-admin-data:/app/data

volumes:
  roo-admin-data:
