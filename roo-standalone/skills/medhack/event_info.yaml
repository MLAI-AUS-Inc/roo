# SUBTOPICS
# ---------------------
subtopics:
  source_page: 3
  list:
    - name: "Aging Populations"
      description: >
        As populations age, healthcare systems face rising multi-morbidity,
        frailty and demand for long-term support.
    - name: "Ward"
    - name: "Workforce Load"
    - name: "Emergency Department"
    - name: "Rural"

