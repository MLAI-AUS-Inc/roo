# ---------------------
# SCORING, JUDGING & WINNERS
# ---------------------
judging:
  small_tract:
    method: "Points-based. Build a vitals-monitoring AI bot and earn points based on performance against challenge criteria and test cases."
    winner: "Team with the highest points wins."
  big_tract:
    method: "Submit a short video pitch. Judges select finalists. Finalists pitch live at Pitch Night."
    finalist_pathway: "Video pitch submission → judged finalists → live pitch on Mar 4."
    num_pitching_teams: 8
    pitch_format: "Two blocks of four pitches."
    scoring_rubric:
      total_points: 50
      categories:
        - name: "Innovation"
          max_score: 5
          description: "Does the solution provide a new or significantly improved approach to what's currently available?"
        - name: "Usefulness"
          max_score: 10
          description: "Does it truly address the needs of the user? Does it solve a large problem?"
        - name: "Viability"
          max_score: 10
          description: "Is it scalable, cost-effective, and easy to adopt?"
        - name: "Technical"
          max_score: 10
          description: "Is what the team built technically complex? Is their future vision technically feasible?"
        - name: "Business"
          max_score: 10
          description: "Does it have the potential to be implemented and possibly funded?"
        - name: "Sustainability"
          max_score: 5
          description: "Will it minimise long-term environmental impact and stand the test of time?"
      note: "Usefulness, Viability, Technical, and Business are weighted higher (10 points each) than Innovation and Sustainability (5 points each). Focus on solving real problems with feasible, well-built solutions."
  judges_span: "Healthcare, tech, and venture."

