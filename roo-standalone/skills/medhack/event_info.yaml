# MedHack: Frontiers - Complete Event Information
# Roo uses this data to answer event questions in Slack.

event_name: "MedHack: Frontiers"
tagline: "Where healthcare meets AI"

description: >
  MedHack is a 2 day hackathon, held between the 21st - 22nd of February, where
  interdisciplinary teams work collaboratively to develop innovative solutions regarding
  the health sector. The theme of this year's event is Frontiers, and it will be an
  opportunity to explore problems faced globally and to develop innovative solutions to
  healthcare's greatest challenges. During MedHack, participants will have the chance
  to be introduced to the human centred design process in collaboration with experts
  associated with each subtopic due to their work or their experiences (mentors).
  Teams of 2-6 participants will have the guidance and support from carefully selected
  mentors and experienced industry professionals from a range of backgrounds (health,
  medtech, business, entrepreneurship) who will help refine the ideas and design.
  Masterclass workshops facilitated by experts will educate and equip participants with
  knowledge to effectively create a product.
source_page: 3

event_website: "mymi.org.au/medhack"

hosted_by:
  - name: "MYMI"
    description: >
      MYMI is an interdisciplinary organisation dedicated to achieving positive impact
      through medical technology, healthcare, and biomedical innovation. They bring
      about collaboration between undergraduates, graduates, PhDs, and Early Career
      Researchers (ECRs) regardless of home institution, discipline, creed, or
      experience. MYMI is composed of a committee and a medtech project portfolio.
      MYMI has focused on several projects which include Heart Hack, Nephros, Aesop
      and project Dreampod.
    source_page: 2
  - name: "MLAI"
    description: >
      MLAI (Machine Learning & AI Australia) is a community-driven network of
      innovators, builders, and ambitious creators exploring the frontiers of artificial
      intelligence. They host hackathons, practical workshops, and experimental
      projects that connect developers, researchers, and founders from all over
      Australia. Their goal is bold: help launch 1,000 Australian startups. From
      building your first AI prototype to growing a high-impact company, MLAI supports
      emerging talent with access to community, real opportunities, and a touch of
      creative chaos - the kind that sparks breakthrough ideas.
    source_page: 2
  - name: "ASME"
    description: "A not-for-profit for clinicians interested in entrepreneurship and innovation."

