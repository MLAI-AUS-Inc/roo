# ---------------------
# FAQ
# ---------------------
faq:
  - question: "What is MedHack: Frontiers?"
    answer: "A healthcare AI hackathon where clinicians, engineers, designers, and students build real prototypes over an intense weekend, then the best Big Tract teams pitch live at Pitch Night."
  - question: "What's the purpose of the event?"
    answer: "To bring healthcare and AI communities together to solve meaningful healthcare challenges and showcase emerging talent."
  - question: "What do participants actually do?"
    answer: "Form teams, pick a track (Small Tract for coding or Big Tract for pitching), use the provided datasets, build a working demo/prototype, and present outcomes (points-based for Small Tract, pitch-based for Big Tract)."
  - question: "Do I need AI experience?"
    answer: "No. The Small Tract (Coding) is designed for first-timers and guides you through building an AI bot from scratch. Workshops + mentors support you throughout."
  - question: "Do I need healthcare experience?"
    answer: "No. Clinicians and healthcare mentors will be around, and mixed teams are encouraged."
  - question: "I'm a clinician. Will I be useful even if I don't code?"
    answer: "Absolutely. Clinical context, workflows, and problem framing are often the difference between a cool demo and a real solution."
  - question: "I'm a designer / product person. Is there a role for me?"
    answer: "Yes. Pitch clarity, user journeys, and workflow design are critical, especially in the Big Tract (Pitching)."
  - question: "Can I come solo?"
    answer: "Yes. Team Formation Night is perfect for meeting teammates, and you can also form/join a team on Day 1."
  - question: "Can my team include beginners and experts together?"
    answer: "Yes, mixed-skill teams are strongly encouraged."
  - question: "Can our team work remotely?"
    answer: "The event isn't run as an online hackathon, but remote contribution can work if at least one teammate attends in person to register the team and everyone has tickets."
  - question: "Is Day 2 optional?"
    answer: "Yes, but it's a big advantage if you want extra support, time, and feedback."
  - question: "Do I need to attend workshops?"
    answer: "Strongly recommended, especially if you're new or you want your pitch/demo to land well."
  - question: "Is there parking available?"
    answer: "Free after 4 PM on weekdays and on weekends in most zones at Monash Clayton."
  - question: "What should I bring?"
    answer: "Laptop, charger, any adapters, a water bottle, anything you need for your build/demo, plus your ticket confirmation and ID. A power board is also a smart move."
  - question: "What should I wear?"
    answer: "Comfortable casual clothing. You'll be sitting, building, and moving between mentor chats."
  - question: "Will food be provided?"
    answer: "Yes. Meals and refreshments are provided during the hackathon days, and food and drinks are included at Pitch Night."
  - question: "Who owns what we build?"
    answer: "Teams retain ownership of what they create and can keep working on projects after the event."
  - question: "Can we publish our project publicly?"
    answer: "Yes, and many teams do. If your project uses provided datasets, follow any dataset handling rules given during the event."
  - question: "Will we ever see identifiable patient data?"
    answer: "No. Datasets are de-identified or synthetic, and the event follows strict privacy and ethical guidelines."
  - question: "How are winners selected in the Small Tract (Coding)?"
    answer: "Points-based. Build a vitals-monitoring AI bot and earn points based on how well your system performs against the challenge criteria and test cases."
  - question: "How are winners selected in the Big Tract (Pitching)?"
    answer: "Submit a short video pitch, judges select finalists, and finalists pitch live at Pitch Night where final winners are chosen. Pitches are scored out of 50 across six categories: Innovation (/5), Usefulness (/10), Viability (/10), Technical (/10), Business (/10), and Sustainability (/5)."
  - question: "What do judges look for?"
    answer: "Usefulness (does it solve a real problem?), Viability (is it scalable and cost-effective?), Technical complexity and feasibility, Business potential (can it be implemented and funded?), Innovation, and Sustainability. Usefulness, Viability, Technical, and Business are weighted highest at 10 points each."
  - question: "How are pitches scored?"
    answer: "Pitches are scored out of 50 total points across six categories: Innovation (/5), Usefulness (/10), Viability (/10), Technical (/10), Business (/10), and Sustainability (/5). The heavier-weighted categories (Usefulness, Viability, Technical, Business) reward teams that solve real problems with feasible, well-built solutions."
  - question: "Are there prizes?"
    answer: "Yes. Winning teams receive prizes, including a cash prize pool around A$2,500. Winners are announced on Pitch Night."
  - question: "Can I get a refund?"
    answer: "Refunds follow the ticketing platform's policy. If you're stuck, email hi@mlai.au or info@mymi.org.au."
  - question: "Can I transfer my ticket to someone else?"
    answer: "Ticket changes are usually handled through the ticketing platform. Email hi@mlai.au or info@mymi.org.au with your order details."
  - question: "Is the hackathon venue accessible?"
    answer: "Yes, wheelchair accessible with good routes between the building and transport/parking areas."
  - question: "Is there a code of conduct?"
    answer: "Yes. Professional behaviour is expected to keep the event respectful and inclusive."
  - question: "I have a question. Who do I contact?"
    answer: "Email hi@mlai.au (general support) or info@mymi.org.au."
  - question: "I'm interested in partnerships or sponsorship. Who do I contact?"
    answer: "Email info@mymi.org.au (or ask the organisers and they'll route you)."
  - question: "Is this a startup event?"
    answer: "It's a hackathon with strong 'founder energy': teams prototype fast, work with mentors, and Big Tract finalists pitch to judges/investors at Pitch Night."
  - question: "How do I get tickets?"
    answer: "Buy via the official event listings shared by MLAI/MYMI (mlai.au and mymi.org.au are the official sites). Team Formation Night, Hackathon, and Pitch Night each have separate tickets."
  - question: "How much are Pitch Night tickets?"
    answer: "Early Bird is A$14.90 and Standard is A$25.00 (availability depends on what's still on sale)."
  - question: "Do finalists need to buy a Pitch Night ticket?"
    answer: "No. Finalists attend Pitch Night for free."
  - question: "Do all team members need tickets?"
    answer: "Yes. Every participant should have their own ticket."
  - question: "Do I need to install anything beforehand?"
    answer: "Have your usual dev setup ready (Python, notebooks, Git, etc.). You'll get track-specific guidance at the event."
  - question: "Can I bring hardware?"
    answer: "Yes, as long as it's safe, portable, and you can manage it at a hackathon table."
  - question: "Is Pitch Night suitable if I didn't participate in the hackathon?"
    answer: "Yes, it's designed as a public showcase."
  - question: "I bought a Pitch Night ticket but I'm also a finalist. What should I do?"
    answer: "Email hi@mlai.au with your ticket receipt and team details so the organisers can sort you out."
  - question: "I'm running late on Day 1. What do I do?"
    answer: "Let your team know and email hi@mlai.au if you think you'll miss sign-in."
  - question: "I have a special request (dietary, accessibility, team issue). Who do I email?"
    answer: "Email hi@mlai.au or info@mymi.org.au with details."
