# ---------------------
# TRACKS / CHALLENGES
# ---------------------
tracks:
  small_tract:
    name: "Small Tract (Coding)"
    description: >
      A guided coding challenge where you'll be walked through creating an AI bot
      from scratch. Your bot will learn to identify when simulated patients are in
      trouble and alert medical staff. Perfect for people who want a structured,
      hands-on build experience.
    data_used: "Simulated patient vitals data"
    scoring: "Points-based. The team with the highest points at the end wins."
    one_liner: "Guided AI build + simulated vitals + points"
  big_tract:
    name: "Big Tract (Pitching)"
    description: >
      An open-ended challenge where you interview mentors, choose your OWN medical
      problem to solve, build a solution, and pitch it to judges. This track is about
      problem discovery, clinical insight, solution design, and presenting your work
      convincingly.
    data_used: "Real, de-identified Electronic Medical Record (EMR) data, plus your own research"
    scoring: "Teams submit a short video pitch. Judges select finalists who pitch live at Pitch Night."
    one_liner: "Choose your problem + build a solution + pitch to judges"
    examples_of_solutions: "AI copilots, workflow tools, diagnostic support concepts, patient-first platforms, and other practical prototypes grounded in healthcare needs."

track_choice_advice: >
  Choose Small Tract (Coding) if you want a guided, structured build experience
  and you're newer to AI. Choose Big Tract (Pitching) if you want to find your own
  medical problem, interview mentors, build a solution, and pitch it to judges.
  You can choose during team formation or at the start of the hackathon once you've
  met your team. Mixed-skill teams are strongly encouraged.

