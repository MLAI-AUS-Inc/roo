display_information:
  name: Roo Admin
  description: Governed administrative assistant for authorised MLAI operators
  background_color: "#1F2937"
features:
  bot_user:
    display_name: Roo Admin
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    request_url: http://209.38.22.179/admin/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: http://209.38.22.179/admin/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
