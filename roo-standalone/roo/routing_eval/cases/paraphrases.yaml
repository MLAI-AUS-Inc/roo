# Paraphrase + trap coverage: realistic phrasings that do NOT copy the blessed
# wording. In deterministic mode these guard against keyword/regex capture
# (verdict must never be `misroute`); in full mode they measure whether the
# LLM layer generalises. Grow this file from real Slack misroutes.

