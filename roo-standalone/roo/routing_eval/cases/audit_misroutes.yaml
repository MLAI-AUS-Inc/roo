# The 28 probe cases from ROUTING_AUDIT.md / routing_probe.py, labelled with
# what the user actually wanted. Cases tagged `misroute-guard` were routed to
# the WRONG skill deterministically (before any LLM) at audit time (2026-06-11).
#
# Gate: no `misroute-guard` case may ever be deterministically misrouted again.
# Falling through to the LLM router is acceptable for these; deciding wrongly
# without the LLM is not.

