services:
  roo:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      # The existing deployment is permanently the Public Roo surface.
      ROO_SURFACE: public
      # Enforce contextual responses in the first allowlisted pilot channel.
      ROO_CONTEXTUAL_RESPONSES_ENABLED: "true"
      ROO_CONTEXTUAL_SHADOW_MODE: "false"
      ROO_CONTEXTUAL_CHANNEL_IDS: C09L4DMMU5N
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./skills:/app/skills:ro
      - roo-data:/app/data
    networks:
      - default
      - roo-admin-gateway

  nginx:
    image: nginx:1.28.3-alpine
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      roo:
        condition: service_healthy
    volumes:
      - ./nginx/roo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/roo-proxy.conf:/etc/nginx/roo-proxy.conf:ro

volumes:
  roo-data:

networks:
  roo-admin-gateway:
    external: true
    name: roo-admin-gateway
