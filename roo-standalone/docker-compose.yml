services:
  roo:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./skills:/app/skills:ro
      - roo-data:/app/data

  nginx:
    image: nginx:1.28.3-alpine
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      roo:
        condition: service_healthy
    volumes:
      - ./nginx/roo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/roo-proxy.conf:/etc/nginx/roo-proxy.conf:ro

volumes:
  roo-data:
